baseURL = "https://lucianodlf.com.ar/"
title = "lucianodlf -v"

copyright = "© {year} Luciano Delfino · hecho con [Hugo](https://gohugo.io/) · Santa Fe, Argentina"
locale = "es"
DefaultContentLanguage = "es"
enableInlineShortcodes = true

[pagination]
pagerSize = 10

[params]
author = "Luciano Delfino"
noindex = false
# Meta description por defecto (las páginas pueden definir `description` o `summary`)
description = "Luciano Delfino, Software Engineer backend y full stack. Desarrollo software para ayudar a las personas a resolver problemas, convertir ideas en procesos y herramientas simples que aporten claridad."
role = "Software Engineer | Backend & Full Stack | AI-Augmented"
# Línea de estado (header de la home, footer, enlaces)
status = "disponible para proyectos freelance y equipos de producto"
email = "luciano.dlf@gmail.com"
location = "Santa Fe, Argentina"
avatar = "img/avatar.jpg"
ogImage = "img/og-default.png"

[params.about]
title = "lucianodlf --verbose"
description = "Desarrollo software para ayudar a las personas a resolver problemas, convertir ideas en procesos y herramientas simples que aporten claridad."

# Redes (footer, enlaces, CV)
[[params.socialLinks]]
icon = "fa-brands fa-github"
title = "GitHub"
url = "https://github.com/lucianodlf"

[[params.socialLinks]]
icon = "fa-brands fa-linkedin"
title = "LinkedIn"
url = "https://www.linkedin.com/in/lucianodelfino"

[[params.socialLinks]]
icon = "fa-solid fa-envelope"
title = "Email"
url = "mailto:luciano.dlf@gmail.com"

[[params.socialLinks]]
icon = "fa-solid fa-rss"
title = "RSS"
url = "/posts/index.xml"

# Navegación principal
[[menus.main]]
name = "Blog"
pageRef = "/posts"
weight = 10

[[menus.main]]
name = "Proyectos"
pageRef = "/projects"
weight = 20

[[menus.main]]
name = "CV"
pageRef = "/cv"
weight = 30

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[markup]
  [markup.goldmark.renderer]
    # Habilita HTML inline en markdown (necesario para algunos shortcodes)
    unsafe = true

  [markup.highlight]
    lineNos            = false
    noClasses          = false
    tabWidth           = 2
    guessSyntax        = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = true

[privacy]
  [privacy.youtube]
    disabled = false
    privacyEnhanced = true
