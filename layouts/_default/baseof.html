<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "es" }}">
<head>
{{- partial "head.html" . }}
</head>
<body class="{{ block "bodyclass" . }}page-{{ .Kind }}{{ with .Type }} type-{{ . }}{{ end }}{{ end }}">
  <a class="skip-link" href="#main">Saltar al contenido</a>
  {{ partial "header.html" . }}
  <main id="main" class="site-main" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
