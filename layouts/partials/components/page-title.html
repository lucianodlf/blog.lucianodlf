{{- /* dict "eyebrow" "..." "title" "..." "lead" "..." */ -}}
<header class="page-head">
  {{ with .eyebrow }}<p class="eyebrow">{{ . }}</p>{{ end }}
  <h1 class="page-title">{{ .title }}<span class="cursor" aria-hidden="true">_</span></h1>
  {{ with .lead }}<p class="lead">{{ . }}</p>{{ end }}
</header>
