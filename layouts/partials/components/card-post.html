{{- /* Card de post. Contexto: página */ -}}
<article class="card card--post">
  <p class="card__meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ partial "fmt-date.html" (dict "date" .Date) }}</time> · {{ .ReadingTime }} min</p>
  <h3 class="card__title"><a class="card__link" href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p class="card__excerpt">{{ .Summary | plainify | htmlUnescape | truncate 140 }}</p>
  {{- with .Params.tags }}
  <p class="card__tags">{{ range first 3 . }}<span class="chip chip--neutral">#{{ lower . }}</span>{{ end }}</p>
  {{- end }}
</article>
