# Textos de la home (layouts/index.html). Editables sin tocar templates.
# Fuentes: mensaje BIORG (versión final 04/11/2026), CV base y LinkedIn unificado (ver docs/feat-brand-redesign/research.md §4).

hero:
  eyebrow: "$ whoami"
  name: "Luciano Delfino"
  role: "Software Engineer | Backend & Full Stack | AI-Augmented"
  lead: "Trabajo en IT desarrollando software para ayudar a las personas a resolver problemas, convertir ideas en procesos y herramientas simples que aporten claridad."
  ctas:
    - { label: "Ver proyectos", url: "/projects/", style: "primary" }
    - { label: "CV completo", url: "/cv/", style: "secondary" }
    - { label: "Escribime", url: "mailto:luciano.dlf@gmail.com", style: "link" }

metrics:
  - { value: "2006", label: "en IT; desarrollando software desde 2016" }
  - { value: "+20", label: "clientes en implementaciones como líder implementador" }
  - { value: "2 de 3", label: "meses: AppLogistic entregado antes con un workflow spec-driven" }
  - { value: "20' → 10'", label: "modelo MILP: de no resolver a una solución válida" }

services:
  eyebrow: "$ man luciano"
  title: "En qué te puedo ayudar"
  items:
    - { icon: "fa-solid fa-layer-group", title: "Desarrollo backend y full stack", text: "Sistemas internos y de gestión: diseño soluciones desde cero o mejoro las que ya tenés." }
    - { icon: "fa-solid fa-plug", title: "Integraciones", text: "Integración entre plataformas: ERP, ecommerce y APIs." }
    - { icon: "fa-solid fa-cubes", title: "Odoo", text: "Implementación y adaptación de Odoo, con módulos propios cuando hace falta." }
    - { icon: "fa-solid fa-gears", title: "Automatización con IA", text: "Procesos, workflows y documentos, con IA cuando aporta valor y validación humana del resultado." }
    - { icon: "fa-solid fa-magnifying-glass-chart", title: "Análisis funcional", text: "Relevamiento y análisis funcional antes de escribir código, para diseñar la estrategia que se adapte a tu caso." }
    - { icon: "fa-solid fa-chalkboard-user", title: "Capacitación y soporte", text: "Capacito a los usuarios, acompaño la adopción y sostengo el mantenimiento evolutivo." }

workflow:
  eyebrow: "$ cat workflow.md"
  title: "Cómo trabajo"
  text: "Trabajo de forma AI-Augmented con un workflow propio basado en specs: genero el backlog desde el documento de alcance y cada issue pasa por investigación, plan, implementación y validación. Así entregué AppLogistic en dos meses para un alcance planificado en tres, con 51 issues en 9 fases."
  steps:
    - { cmd: "investigación", text: "Entiendo el problema, el contexto y las herramientas que convienen." }
    - { cmd: "plan", text: "Fases chicas, cada una con su criterio de aceptación." }
    - { cmd: "implementación", text: "Código con agentes, guiado por la spec y versionado por fase." }
    - { cmd: "validación", text: "Tests, métricas y la persona que lo va a usar." }
  quote: "Los LLMs amplían lo que puedo hacer; la metodología, mi criterio y mis decisiones son con lo que más valor aporto."

