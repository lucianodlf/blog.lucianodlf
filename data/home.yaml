  title: "Cómo trabajo"
  text: "Trabajo de forma AI-Augmented con un workflow propio basado en specs: genero el backlog desde el documento de alcance y cada issue pasa por investigación, plan, implementación y validación. Así entregué AppLogistic en dos meses para un alcance planificado en tres, con 51 issues en 9 fases."
  steps:
    - { cmd: "investigación", text: "Entiendo el problema, el contexto y las herramientas que convienen." }
    - { cmd: "plan", text: "Fases chicas, cada una con su criterio de aceptación." }
    - { cmd: "implementación", text: "Código con agentes, guiado por la spec y versionado por fase." }
    - { cmd: "validación", text: "Tests, métricas y la persona que lo va a usar." }
  quote: "Los LLMs amplían lo que puedo hacer; la metodología, mi criterio y mis decisiones son con lo que más valor aporto."

