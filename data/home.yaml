  name: "Luciano Delfino"
  role: "Software Engineer | Backend & Full Stack | AI-Augmented"
  lead: "Trabajo en IT desarrollando software para ayudar a las personas a resolver problemas, convertir ideas en procesos y herramientas simples que aporten claridad."
  ctas:
    - { label: "Ver proyectos", url: "/projects/", style: "primary" }
    - { label: "CV completo", url: "/cv/", style: "secondary" }
    - { label: "Escribime", url: "mailto:luciano.dlf@gmail.com", style: "link" }

metrics:
  - { value: "2006", label: "en IT; desarrollando software desde 2016" }
  - { value: "+20", label: "clientes acompañados en implementaciones de software" }
  - { value: "2 de 3", label: "meses: AppLogistic entregado antes con un workflow spec-driven" }
  - { value: "7", label: "modelos de OCR comparados en un benchmark propio" }

services:
  eyebrow: "$ man luciano"
  title: "En qué te puedo ayudar"
  items:
    - { icon: "fa-solid fa-layer-group", title: "Sistemas internos y de gestión", text: "Desarrollo backend y full stack de sistemas que tu equipo usa todos los días." }
    - { icon: "fa-solid fa-plug", title: "Integraciones", text: "Conecto ERP, ecommerce y APIs para que la información no se cargue dos veces." }
    - { icon: "fa-solid fa-cubes", title: "Odoo", text: "Implementación y adaptación, con módulos propios cuando hace falta." }
    - { icon: "fa-solid fa-gears", title: "Automatización", text: "Procesos y workflows, con IA cuando aporta valor y validación humana del resultado." }
    - { icon: "fa-solid fa-magnifying-glass-chart", title: "Análisis funcional", text: "Relevo cómo trabajás antes de escribir código, para construir lo que se va a usar." }
    - { icon: "fa-solid fa-chalkboard-user", title: "Capacitación y soporte", text: "Acompaño la adopción de la herramienta y su mantenimiento evolutivo." }

workflow:
  eyebrow: "$ cat workflow.md"
  title: "Cómo trabajo"
  text: "Trabajo de forma AI-Augmented: escribo la especificación, planifico por fases y uso agentes para implementar, con validación en cada paso. Así entregué AppLogistic en dos meses para un alcance pensado en tres, con 51 issues en 9 fases."
  steps:
    - { cmd: "spec", text: "Qué problema resolvemos y cómo sabemos que está resuelto." }
    - { cmd: "plan", text: "Fases chicas, cada una con su criterio de aceptación." }
    - { cmd: "implementación", text: "Código con agentes, revisado y versionado por fase." }
    - { cmd: "validación", text: "Pruebas, métricas y la persona que lo va a usar." }
  quote: "Los LLMs amplían lo que puedo hacer; la metodología, mi criterio y mis decisiones son con lo que más valor aporto."

