# Servicios: textos y variantes en data/services.yaml

workflow:
  eyebrow: "$ cat workflow.md"
  title: "Cómo trabajo"
  text: "Mi workflow es spec-driven y AI-Augmented: primero entiendo el problema y acordamos qué, cómo y para qué construir; después lo construimos."
  steps:
    - { cmd: "investigación", text: "Entiendo el problema y busco las herramientas adecuadas para darles a mis agentes un contexto relevante." }
    - { cmd: "exploración", text: "Intercambio ideas con un agente para tomar mejores decisiones, fundamentadas en la investigación y en las necesidades reales." }
    - { cmd: "especificación", text: "Reviso y corrijo con la IA el alcance, las decisiones y los criterios de aceptación, o parto de los que ella propone." }
    - { cmd: "plan", text: "Si la tarea lo demanda, planifico, reviso el plan e itero con un agente hasta llegar al resultado que busco." }
    - { cmd: "implementación", text: "Los agentes escriben el código guiados por la especificación y yo lo reviso." }
    - { cmd: "validación", text: "Tests, métricas, usabilidad y feedback de los usuarios." }
  quote: "Los LLMs amplían lo que puedo hacer; la metodología, mi criterio y mis decisiones son con lo que más valor aporto."

