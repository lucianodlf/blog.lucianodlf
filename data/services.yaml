# Sección "Servicios" de la home (layouts/index.html, ancla #servicios).
# Cuatro variantes de textos; se elige con `active`. Skills solo con uso real
# (fuente: mi-profile/piezas/skills.md y pitch.md, "Evidencia por promesa").
# Comparación de variantes: .agents/working-progress/items/004-feat-ajustes-home-cv-servicios/inputs/propuestas.md

active: "a"

cta:
  title: "¿No sabés por dónde empezar?"
  text: "Contame qué querés resolver y vemos juntos qué conviene construir primero."
  label: "Escribime"
  url: "mailto:luciano.dlf@gmail.com"

variants:
  # A. Cercana a los textos actuales (CV, pitch de servicios, home)
  a:
    eyebrow: "$ man luciano"
    title: "En qué te puedo ayudar"
    intro: "Software a medida, pensado para el equipo que lo va a usar todos los días."
    items:
      - title: "Desarrollo backend y full stack"
        text: "Sistemas internos y de gestión: diseño soluciones desde cero o mejoro las que ya tenés."
        skills: ["Python", "FastAPI", "Node.js", "Vue.js", "PostgreSQL", "Redis"]
      - title: "Integraciones"
        text: "Integración entre plataformas: ERP, ecommerce y APIs, para sincronizar datos y evitar procesos duplicados."
        skills: ["APIs REST", "WooCommerce", "ARCA", "ETL", "Migración de datos"]
      - title: "Implementaciones"
        text: "Implemento sistemas para tu empresa: instalaciones, configuraciones, migraciones de datos, acopañamiento en produción y soporte."
        skills: ["Odoo", "Migración desde Excel", "Puesta en marcha", "Soporte"]
      - title: "Automatización con IA"
        text: "Procesos, workflows y bases de conocimiento y gestion de memoria para agentes"
        skills: ["LiteLLM", "n8n", "OCR", "Claude Code", "MCP", "RAG"]
      - title: "Web scraping"
        text: "Recolección y enriquecimiento de datos desde APIs y sitios web."
        skills: ["BeautifulSoup", "Playwright", "Browser-use", Puppeteer]
      - title: "Administración de sistemas"
        text: "Servidores, contenedores, certificados y backups, para que el sistema funcione y se pueda mantener."
        skills: ["Docker", "Linux", "Caddy", "Nginx", "Apache", "GitLab CI", "Cloudflare"]
      - title: "Análisis Funcional"
        text: "Relevamiento y análisis antes de escribir código, para diseñar la estrategia que se adapte a tu caso."
        skills: ["Relevamiento", "Diseño", "Lluvia de ideas", "Preventa técnica"]
      - title: "Formación y capacitación"
        text: "Impulso la inclusión tecnológica mediante la transferencia de conocimiento, facilitando que las personas desarrollen competencias clave para el entorno digital."
        skills: ["Capacitación de usuarios", "Mentoría técnica", "Alfabetización digital"]

  # B. Desde el problema del cliente: el título es la situación que trae
  b:
    eyebrow: "$ grep -r problema ./tu-empresa"
    title: "Lo que puedo resolver"
    intro: "Si alguna de estas te suena conocida, hablemos."
    items:
      - title: "La planilla ya no alcanza"
        text: "Llevo la caja, el stock o las cuentas corrientes de Excel y papel a un sistema hecho para cómo trabajás."
        skills: ["Python", "FastAPI", "Node.js", "Vue.js", "PostgreSQL"]
      - title: "Tus sistemas no se hablan"
        text: "Conecto el ERP, la tienda online y los servicios que usás para que los datos se carguen una sola vez."
        skills: ["APIs REST", "WooCommerce", "ARCA", "ETL"]
      - title: "Necesitás implementar un sistema"
        text: "Programo, instalo, configuro y migro tus datos al sistema que elijas, lo pongo en producción y dejo soporte."
        skills: ["Odoo", "Módulos propios", "Migración desde Excel", "Puesta en marcha", "Soporte"]
      - title: "Tareas que se repiten"
        text: "Automatizo lo que hoy se hace a mano, con IA solo donde suma y siempre con una persona que valida."
        skills: ["n8n", "LiteLLM", "OCR", "Gemini", "MCP"]
      - title: "Los datos están en la web"
        text: "Armo scrapers y consultas a APIs que completan tu información sin copiar y pegar."
        skills: ["BeautifulSoup", "Requests", "Playwright", "APIs públicas"]
      - title: "Nadie sabe dónde corre"
        text: "Ordeno servidores, despliegues y backups para que el sistema no dependa de una sola persona."
        skills: ["Docker", "Linux", "Caddy", "GitLab CI", "VPS"]
      - title: "No sabés qué pedir"
        text: "Relevo cómo trabajás y convierto la necesidad en un alcance claro antes de presupuestar."
        skills: ["Relevamiento", "Análisis funcional", "Preventa técnica"]
      - title: "El sistema está, pero no se usa"
        text: "Capacito al equipo y acompaño la adopción hasta que lo usan sin mí."
        skills: ["Capacitación de usuarios", "Mentoría técnica"]

  # C. Terminal: cada servicio es un comando, en línea con los títulos "$ ..." del sitio
  c:
    eyebrow: "$ luciano --help"
    title: "Comandos disponibles"
    intro: "Uso: luciano [servicio] --para tu-proyecto"
    items:
      - title: "build"
        text: "Desarrollo backend y full stack de sistemas internos y de gestión, desde la base de datos hasta la interfaz."
        skills: ["Python", "FastAPI", "Node.js", "Vue.js", "PostgreSQL"]
      - title: "integrate"
        text: "Sincroniza ERP, ecommerce y APIs de terceros. Sin cargas duplicadas."
        skills: ["APIs REST", "WooCommerce", "ARCA", "ETL"]
      - title: "implement"
        text: "Programa, instala, configura y migra. Puesta en producción y soporte incluidos."
        skills: ["Odoo", "Módulos propios", "Migración desde Excel", "Puesta en marcha", "Soporte"]
      - title: "automate --with-ai"
        text: "Workflows y documentos automatizados. La IA propone, una persona valida."
        skills: ["n8n", "LiteLLM", "OCR", "Ollama", "MCP"]
      - title: "scrape"
        text: "Datos de sitios y APIs públicas, limpios y listos para usar."
        skills: ["BeautifulSoup", "Requests", "Playwright"]
      - title: "sysadmin"
        text: "Servidores, contenedores, proxy, certificados, CI y backups programados."
        skills: ["Docker", "Caddy", "Nginx", "GitLab CI", "Cloudflare"]
      - title: "analyze"
        text: "Relevamiento y análisis funcional antes de la primera línea de código."
        skills: ["Relevamiento", "Preventa técnica"]
      - title: "teach"
        text: "Capacitación y acompañamiento para que el equipo lo use sin mí."
        skills: ["Capacitación de usuarios", "Mentoría técnica"]

  # D. Recorrido de un proyecto: los servicios ordenados como etapas, de la idea al uso
  d:
    eyebrow: "$ cat recorrido.md"
    title: "De la idea al sistema que se usa"
    intro: "Puedo sumarme en una etapa o acompañar el recorrido completo."
    items:
      - title: "Entender"
        text: "Relevo cómo trabaja la gente y qué información maneja. Ahí aparece lo que hay que construir."
        skills: ["Relevamiento", "Análisis funcional", "Preventa técnica"]
      - title: "Diseñar"
        text: "Convierto la necesidad en un alcance claro y en fases chicas."
        skills: ["Spec-Driven Development"]
      - title: "Construir"
        text: "Backend, frontend y base de datos para sistemas internos y de gestión."
        skills: ["Python", "FastAPI", "Node.js", "Vue.js", "PostgreSQL"]
      - title: "Conectar"
        text: "Integro ERP, ecommerce y APIs, y traigo datos de la web cuando hacen falta."
        skills: ["WooCommerce", "ARCA", "BeautifulSoup", "ETL"]
      - title: "Automatizar"
        text: "Saco del medio las tareas repetitivas, con IA donde aporta y validación humana."
        skills: ["n8n", "LiteLLM", "OCR", "MCP"]
      - title: "Desplegar"
        text: "Entornos reproducibles, despliegue continuo y backups."
        skills: ["Docker", "Linux", "Caddy", "GitLab CI"]
      - title: "Implementar"
        text: "Programo, instalo, configuro y migro, y dejo el sistema en producción con soporte."
        skills: ["Odoo", "Módulos propios", "Migración desde Excel", "Puesta en marcha", "Soporte"]
      - title: "Enseñar"
        text: "Capacito a los usuarios y transfiero lo técnico al equipo: control de versiones, despliegue y flujos con IA."
        skills: ["Capacitación de usuarios", "Mentoría técnica", "Git", "Claude Code"]
